spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:icm}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowMultiQueries=false"
        username: ${MYSQL_USERNAME:root}
        password: ${MYSQL_PASSWORD:}
      slave:
        enabled: false
        url:
        username:
        password:
      initialSize: 5
      minIdle: 10
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: ${DRUID_STAT_ENABLED:false}
      statViewServlet:
        enabled: ${DRUID_STAT_ENABLED:false}
        allow: ${DRUID_STAT_ALLOW:127.0.0.1}
        url-pattern: /druid/*
        login-username: ${DRUID_STAT_USERNAME:ruoyi}
        login-password: ${DRUID_STAT_PASSWORD:change-me}
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: false
      clickhouse:
        enabled: true
        driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
        jdbc-url: jdbc:clickhouse://${CLICKHOUSE_HOST:localhost}:${CLICKHOUSE_PORT:8123}/${CLICKHOUSE_DATABASE:easydata}
        username: ${CLICKHOUSE_USERNAME:default}
        password: ${CLICKHOUSE_PASSWORD:}
